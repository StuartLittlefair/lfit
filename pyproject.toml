[build-system]
requires = ["setuptools>=61.0", "Cython", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "LFIT"
version = "0.2"
authors = [
  { name="Stuart Littlefair", email="s.littlefair@shef.ac.uk" },
]
description = "A python package for fitting CV lightcurves"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/StuartLittlefair/lfit"
Issues = "https://github.com/StuartLittlefair/lfit/issues"